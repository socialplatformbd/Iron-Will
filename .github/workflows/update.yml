name: Update from ZIP
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-from-zip
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the newest zip
        id: find
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .zip file in the repository root. Upload the zip first."
            exit 0
          fi
          chosen="${zips[0]}"
          while IFS= read -r f; do
            case "$f" in
              */*) ;;
              *.zip) if [ -f "$f" ]; then chosen="$f"; fi ;;
            esac
          done < <(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null || true)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$chosen" >> "$GITHUB_OUTPUT"
          echo "Using: $chosen"

      - name: Replace project files with the zip contents
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          rm -rf /tmp/new && mkdir /tmp/new
          unzip -q -o "$ZIP" -d /tmp/new
          PKG=$(find /tmp/new -maxdepth 3 -name package.json -not -path '*/node_modules/*' -not -path '*/__MACOSX/*' -print -quit)
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found inside $ZIP"
            exit 1
          fi
          SRC=$(dirname "$PKG")
          echo "Project folder inside zip: $SRC"
          rm -rf src public
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='dist/' "$SRC"/ ./
          rm -f -- "$ZIP"

      - name: Commit and push
        id: commit
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Update from $ZIP"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
